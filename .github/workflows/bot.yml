name: paper-trading bot

# The paper-trading bot, one step every ~10 minutes: fill its mock offers
# against the newest real 5-minute GE trades (it catches up on every bucket it
# missed, so late or skipped runs lose nothing) and, once per hour, let the
# model decide. State lives on the `live` branch, which the app's Bot tab reads.
# Don't also run research/bot_loop.sh against the same branch: both
# force-push the state.
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: paper-trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: live
          path: live
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/bot.yml
      # Pinned to the versions that wrote the bot's pickled state.
      - run: pip install numpy==2.5.3 pandas==3.0.5 pyarrow==26.0.0 lightgbm==4.7.0
      - name: Bot step
        env:
          OSF_DATA: ${{ github.workspace }}/live/data
        run: python research/live.py --once --model live/data/model
      - name: Publish state
        working-directory: live
        run: |
          cp data/live/state.json state.json
          git config user.name "osrs-flipper-bot"
          git config user.email "osrs-flipper-bot@users.noreply.github.com"
          git add -A
          git commit -q --amend -m "Bot state" || exit 0
          git push -q -f origin live
