name: plugin release

# Builds the RuneLite plugin and publishes flip-planner.jar with the start scripts
# as a GitHub release: when a tag like plugin-v0.1.0 is pushed, or when run by
# hand with a version (the release then creates the tag on the commit it built).
on:
  push:
    tags: [ 'plugin-v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version, e.g. 0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build and test
        working-directory: plugin
        run: ./gradlew build --no-daemon
      - name: Package
        run: |
          mkdir -p out/Flip-Planner-plugin
          cp plugin/build/libs/flip-planner.jar plugin/dist/* plugin/README.md out/Flip-Planner-plugin/
          (cd out && zip -r Flip-Planner-plugin.zip Flip-Planner-plugin)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="plugin-v${VERSION}"; fi
          gh release create "$TAG" out/Flip-Planner-plugin.zip plugin/build/libs/flip-planner.jar \
            --target "$GITHUB_SHA" --title "Flip Planner plugin ${TAG#plugin-v}" --prerelease \
            --notes "Download Flip-Planner-plugin.zip, unzip it anywhere (for example D:\Flip-Planner), and follow README.md inside: double-click 'Start RuneLite with Flip Planner.bat'. Needs RuneLite installed and opened once. Test build: not on the Plugin Hub yet."
